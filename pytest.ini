[pytest]
# Pytest configuration for NegotiatorPro

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-config=.coveragerc
    -W ignore::DeprecationWarning

# Coverage minimum (80%)
# Can be enforced with: --cov-fail-under=80

# Markers for categorizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    docker: Docker-related infrastructure tests
    slow: Tests that take significant time to run
    requires_docker: Tests that require Docker daemon
    requires_api_key: Tests that require OpenAI API key

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout for tests (in seconds)
timeout = 300

# Minimum Python version
minversion = 3.8
