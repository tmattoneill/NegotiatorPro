version: '3.8'

services:
  negotiator-pro:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: negotiator-pro
    restart: unless-stopped

    # Port mapping - map host port to container port
    ports:
      - "7860:7860"

    # Environment variables
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860

    # Volume mounts for persistent data
    volumes:
      # Persist vectorstore (embeddings database)
      - ./vectorstore:/app/vectorstore

      # Persist uploaded documents
      - ./uploads:/app/uploads

      # Source documents (negotiation books)
      - ./sources:/app/sources

      # Persist configuration files
      - ./admin_config.json:/app/admin_config.json
      - ./admin_sessions.json:/app/admin_sessions.json
      - ./usage_stats.json:/app/usage_stats.json
      - ./embedding_config.json:/app/embedding_config.json
      - ./prompt_config.json:/app/prompt_config.json

    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

    # Networking
    networks:
      - negotiator-network

    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:7860', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  negotiator-network:
    driver: bridge
