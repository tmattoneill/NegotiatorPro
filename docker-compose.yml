services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: negotiator-pro-postgres
    restart: unless-stopped

    # Environment variables
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-negotiatorpro}
      - POSTGRES_USER=${POSTGRES_USER:-negotiatorpro}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    # Volume for persistent data - mapped to /data/db
    volumes:
      - ./data/db:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d

    # Port mapping (optional, for external access during development)
    ports:
      - "5432:5432"

    # Networking
    networks:
      - negotiator-network

    # Health check
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-negotiatorpro}"]
      interval: 10s
      timeout: 5s
      retries: 5

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: negotiator-pro-backend
    restart: unless-stopped

    # Port mapping - FastAPI backend
    ports:
      - "8000:8000"

    # Environment variables
    environment:
      # App environment (development/production)
      - APP_ENV=${APP_ENV:-development}

      # LLM API Keys
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - OLLAMA_CLOUD_URL=${OLLAMA_CLOUD_URL:-https://ollama.com}

      # Database
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-negotiatorpro}
      - POSTGRES_USER=${POSTGRES_USER:-negotiatorpro}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

      # Security (required in production)
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}

      # CORS (comma-separated origins for production)
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}

    # Depends on database
    depends_on:
      postgres:
        condition: service_healthy

    # Volume mounts for persistent data - all in /data
    volumes:
      # Persist vectorstore (embeddings database) in /data/vectorstore
      - ./data/vectorstore:/app/vectorstore

      # Persist uploaded documents in /data/uploads
      - ./data/uploads:/app/uploads

      # Source documents (negotiation books) in /data/sources
      - ./data/sources:/app/sources

      # Persist configuration files in /data/config
      - ./data/config:/app/config

      # Mount config.json (main application configuration)
      - ./config.json:/app/config.json

      # Mount llm_backend_config.json (LLM model definitions)
      - ./llm_backend_config.json:/app/llm_backend_config.json

      # Mount migrations for database setup scripts
      - ./migrations:/app/migrations

      # Mount backend code (for development hot reload)
      - ./backend:/app/backend

    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

    # Networking
    networks:
      - negotiator-network

    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # React Frontend (development mode)
  frontend:
    image: node:20-alpine
    container_name: negotiator-pro-frontend
    restart: unless-stopped
    working_dir: /app/frontend

    # Port mapping - React dev server
    ports:
      - "5173:5173"

    # Environment variables
    environment:
      - VITE_API_URL=http://backend:8000

    # Volume mounts
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules

    # Command to run dev server
    command: sh -c "npm install && npm run dev -- --host"

    # Networking
    networks:
      - negotiator-network

    # Depends on backend
    depends_on:
      - backend

networks:
  negotiator-network:
    driver: bridge
