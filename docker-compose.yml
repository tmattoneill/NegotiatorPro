services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped

    # Environment variables
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-negotiatorpro}
      - POSTGRES_USER=${POSTGRES_USER:-negotiatorpro}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    # Volume for persistent data - mapped to /data/db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d

    # Port mapping (optional, for external access during development)
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"

    # Networking
    networks:
      - negotiator-network

    # Health check
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-negotiatorpro}"]
      interval: 10s
      timeout: 5s
      retries: 5

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    # Port mapping - FastAPI backend
    ports:
      - "${API_HOST_PORT:-8000}:8000"

    # Pull all secrets/config from the project .env file. This bypasses the
    # docker-compose ${VAR} interpolation which would otherwise let the host
    # shell's OPENAI_API_KEY (etc.) override the project's intended value.
    env_file:
      - .env

    # Only set values that must differ inside the container vs .env.
    # Everything else (API keys, secrets, ports etc.) flows from env_file.
    environment:
      # Container-internal hostnames — postgres is the compose service name
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432

      # IMPORTANT: blank out DATABASE_URL inside the container. The .env file
      # has it set to localhost (correct for running uvicorn directly on the
      # host), but parsed inside the container it points at the container
      # itself, not the postgres service. With DATABASE_URL empty, the code
      # falls back to POSTGRES_HOST/PORT/USER/PASSWORD individually.
      - DATABASE_URL=

      # Canonical corpus location inside the container (bind-mounted from host)
      - DATA_SOURCES_DIR=/app/data-sources

    # Setup Host (ollama)
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Depends on database
    depends_on:
      postgres:
        condition: service_healthy

    # Volume mounts for persistent data - all in /data
    volumes:
      # Persist vectorstore (embeddings database) in /data/vectorstore
      - ./data/vectorstore:/app/vectorstore

      # Persist uploaded documents in /data/uploads
      - ./data/uploads:/app/uploads

      # Canonical corpus lives outside the project, in ../data-sources/
      # Mounted read-write so admin uploads can land here.
      - ../data-sources:/app/data-sources

      # Mount the prompts/ directory so the three-layer prompt stack works
      # in the container: meta (amfonica-meta.md) + persona YAMLs. Edits on
      # the host are picked up by PromptManager (meta is re-read each call;
      # personae require a container restart or prompt_manager.reload_personae()).
      - ./prompts:/app/prompts

      # Persist configuration files in /data/config
      - ./data/config:/app/config

      # Mount config.json (main application configuration)
      - ./config.json:/app/config.json

      # Mount llm_backend_config.json (LLM model definitions)
      - ./llm_backend_config.json:/app/llm_backend_config.json

      # Mount migrations for database setup scripts
      - ./migrations:/app/migrations

      # Mount backend code (for development hot reload)
      - ./backend:/app/backend

    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

    # Networking
    networks:
      - negotiator-network

    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # React Frontend (development mode)
  frontend:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app/frontend

    # Port mapping - React dev server
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"

    # Environment variables
    environment:
      - VITE_API_URL=http://backend:8000

    # Volume mounts
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules

    # Command to run dev server
    command: sh -c "npm ci && npm run dev -- --host"

    # Networking
    networks:
      - negotiator-network

    # Depends on backend
    depends_on:
      - backend

networks:
  negotiator-network:
    driver: bridge

volumes:
  postgres_data:
