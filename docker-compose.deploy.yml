# Compose for the deployed Amfonica backend, used for both dev.amfonica.com
# (project "dev", port 8090) and www.amfonica.com (project "amfonica-prod",
# port 8091). Each site directory has its own .env.
#
# The image is tagged by git sha (amfonica-backend:<sha>). deploy.sh builds it
# and also tags it :dev; promote.sh retags the same image :prod and runs it with
# --no-build, so prod runs exactly the bytes that were verified on dev.
#
# Differs from docker-compose.yml (local dev): no source hot-reload, no Vite dev
# container (the built SPA is served by the host nginx), Postgres has no host
# port (internal only), and the backend binds to 127.0.0.1 so only the host
# nginx can reach it. Used by deploy.sh on the remote host.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: amfonica-backend:${IMAGE_TAG:-dev}
    restart: unless-stopped

    # Loopback only — the host nginx reverse-proxies /api here.
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8090}:8000"

    # All secrets/config come from the project .env (rsynced from .env.dev).
    env_file:
      - .env

    environment:
      - DATA_SOURCES_DIR=/app/data-sources

    extra_hosts:
      - "host.docker.internal:host-gateway"

    # No command override -> uses the Dockerfile CMD (uvicorn, no --reload).

    # Data only — no source bind mounts (the image is the source of truth).
    volumes:
      - ./data/vectorstore:/app/vectorstore
      - ./data/uploads:/app/uploads
      - ./data-sources:/app/data-sources
      - ./prompts:/app/prompts
      - ./data/config:/app/config
      - ./config.json:/app/config.json
      - ./llm_backend_config.json:/app/llm_backend_config.json
      - ./migrations:/app/migrations

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    networks:
      - amfonica-network

    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  amfonica-network:
    driver: bridge
