# nginx vhost for the Amfonica dev site.
#
# Serves the static React build from __WEBROOT__ and reverse-proxies /api to the
# backend API container on 127.0.0.1:__APP_PORT__. deploy.sh substitutes the
# __WEBROOT__ / __APP_PORT__ / __DOMAIN__ placeholders before installing it.
# certbot --nginx rewrites this file to add the TLS listener and an HTTP->HTTPS
# redirect once DNS for __DOMAIN__ points at this host.
#
# Access control: cookie-based pre-auth (see backend/api/routes/dev_auth.py).
# Requests from Matt's home IP subnet bypass the check entirely. Everyone else
# sees a password form on first visit; a 30-day signed cookie grants access
# for subsequent page loads without prompting again.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root __WEBROOT__;
    index index.html;

    # Allow large document uploads (PDF corpus / negotiation files).
    client_max_body_size 50m;

    # Internal sub-request used by auth_request below.
    # Passes the browser's Cookie header through; returns 200 (valid) or 401.
    location = /internal-dev-auth-check {
        internal;
        proxy_pass http://127.0.0.1:__APP_PORT__/api/dev-auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # Dev auth routes — exempt from the cookie check (obviously).
    # nginx strips /dev-auth/ and proxies the remainder to /api/dev-auth/.
    location /dev-auth/ {
        proxy_pass http://127.0.0.1:__APP_PORT__/api/dev-auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect on auth failure — preserves the original URL as ?next=.
    location @dev_auth_redirect {
        return 302 /dev-auth/login?next=$request_uri;
    }

    # API -> backend container (loopback). Protected by cookie auth + IP bypass.
    location /api/ {
        satisfy any;
        allow 80.249.28.0/24;
        deny all;
        auth_request /internal-dev-auth-check;
        error_page 401 403 = @dev_auth_redirect;

        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA: serve built assets, fall back to index.html for client-side routes.
    # Protected by the same cookie auth + IP bypass.
    location / {
        satisfy any;
        allow 80.249.28.0/24;
        deny all;
        auth_request /internal-dev-auth-check;
        error_page 401 403 = @dev_auth_redirect;

        try_files $uri $uri/ /index.html;
    }
}
