# TLS vhosts for the production Amfonica site.
#
#   www.amfonica.com  serves the built SPA and proxies /api to the prod backend
#                     container on 127.0.0.1:8091.
#   amfonica.com      301s to https://www.amfonica.com.
#
# Static file: certbot never edits it. Certs come from
# `certbot certonly --webroot` (see deploy/remote-promote.sh) and renew via
# certbot.timer with a deploy hook that reloads nginx.
#
# Private beta: every route sits behind the same signed-cookie gate as dev
# (backend/api/routes/dev_auth.py), with prod's own password and secret and no
# IP bypass. To open the site, delete the four gate lines in each protected
# location and the @gate_redirect / internal check locations.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.amfonica.com;

    ssl_certificate /etc/letsencrypt/live/www.amfonica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.amfonica.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/webdev/sites/amfonica.com/www/public;
    index index.html;

    client_max_body_size 50m;

    # add_header in a location replaces these rather than adding to them, so
    # any location that sets its own header repeats the security set.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- beta gate ---------------------------------------------------------
    location = /internal-gate-check {
        internal;
        proxy_pass http://127.0.0.1:8091/api/dev-auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location /dev-auth/ {
        proxy_pass http://127.0.0.1:8091/api/dev-auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @gate_redirect {
        return 302 /dev-auth/login?next=$request_uri;
    }

    # --- app ---------------------------------------------------------------
    location /api/ {
        auth_request /internal-gate-check;
        error_page 401 403 = @gate_redirect;

        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Vite emits content-hashed filenames, so these never change in place.
    location /assets/ {
        auth_request /internal-gate-check;
        error_page 401 403 = @gate_redirect;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    # index.html must revalidate so a promote takes effect on the next load.
    location / {
        auth_request /internal-gate-check;
        error_page 401 403 = @gate_redirect;

        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name amfonica.com;

    ssl_certificate /etc/letsencrypt/live/www.amfonica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.amfonica.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.amfonica.com$request_uri;
}
