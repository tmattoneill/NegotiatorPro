# Port 80 for every production Amfonica name.
#
# Serves Let's Encrypt HTTP-01 challenges from a shared webroot (certbot
# certonly --webroot), and sends everything else to the one canonical URL,
# https://www.amfonica.com, in a single hop.
#
# Installed by deploy/remote-promote.sh before any certificate exists, so it
# must never reference TLS files. The 443 blocks live in www.amfonica.com.conf
# and amfonica.ai.conf and are installed only once their certs are issued.

server {
    listen 80;
    listen [::]:80;
    server_name www.amfonica.com amfonica.com www.amfonica.ai amfonica.ai;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://www.amfonica.com$request_uri;
    }
}
