# TLS redirect for amfonica.ai and www.amfonica.ai to the canonical
# https://www.amfonica.com. Kept apart from www.amfonica.com.conf so a problem
# with the .ai certificate can never take the main site down.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name amfonica.ai www.amfonica.ai;

    ssl_certificate /etc/letsencrypt/live/amfonica.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amfonica.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.amfonica.com$request_uri;
}
